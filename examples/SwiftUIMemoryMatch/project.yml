name: SwiftUIMemoryMatch
options:
  bundleIdPrefix: com.vku.seminar
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  SwiftUIMemoryMatch:
    type: application
    platform: iOS
    sources:
      - SwiftUIMemoryMatch
    info:
      path: SwiftUIMemoryMatch/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: Memory Match
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vku.seminar.SwiftUIMemoryMatch
        TARGETED_DEVICE_FAMILY: 1
schemes:
  SwiftUIMemoryMatch:
    build:
      targets:
        SwiftUIMemoryMatch: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
